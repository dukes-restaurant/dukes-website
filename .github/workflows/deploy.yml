# Baut die Seite bei jeder Änderung auf main (z.B. aus dem CMS) und täglich um 04:00 UTC
# (damit vergangene Events verschwinden und das neue Wochenmenü erscheint).
# Veröffentlicht per rsync/SSH auf den eigenen Server, sobald die DEPLOY_*-Secrets gesetzt sind.
name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # Samstag 23:00 Zürich (Winter-/Sommerzeit): Wochenmenü wechselt.
    # 21:05 UTC = 23:05 Sommerzeit, 22:05 UTC = 23:05 Winterzeit; der jeweils andere Lauf ist harmlos.
    - cron: '5 21,22 * * 6'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci: exakt die Versionen aus package-lock.json, ohne Install-Skripte von Paketen
      - run: npm ci --ignore-scripts
      - run: npm run build

      - name: Deploy (rsync über SSH)
        if: env.DEPLOY_HOST != ''
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          rsync -rlz --delete --checksum \
            -e "ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes" \
            dist/ "$DEPLOY_USER@$DEPLOY_HOST:$DEPLOY_PATH/"
          rm -f ~/.ssh/deploy_key
